services:
  gluetun:
    image: ghcr.io/qdm12/gluetun:v3.41.3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    expose:
      - 9696
      - 9091
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${VPN_USER}
      - OPENVPN_PASSWORD=${VPN_PASS}
      - SERVER_REGIONS=${SERVER_REGIONS:-}
      - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS:-172.18.0.0/16}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - gluetun-data:/gluetun
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://localhost:8000/v1/openvpn/status',
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
      - SERVICE_URL_PROWLARR_9696
    volumes:
      - prowlarr-config:/config
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9696 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

  media-init:
    image: alpine:3.20
    command:
      [
        'sh',
        '-c',
        'mkdir -p /downloads/tv /downloads/movies /downloads/music && chown -R ${PUID:-1000}:${PGID:-1000} /downloads',
      ]
    volumes:
      - ${MEDIA_DIR}:/downloads
    restart: 'no'
    exclude_from_hc: true

  transmission:
    image: lscr.io/linuxserver/transmission:4.1.3
    network_mode: 'service:gluetun'
    depends_on:
      gluetun:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - transmission-config:/config
      - ${MEDIA_DIR}:/downloads
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    depends_on:
      media-init:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
      - SERVICE_URL_SONARR_8989
    volumes:
      - sonarr-config:/config
      - ${MEDIA_DIR}:/downloads
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:8989 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0
    depends_on:
      media-init:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
      - SERVICE_URL_RADARR_7878
    volumes:
      - radarr-config:/config
      - ${MEDIA_DIR}:/downloads
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:7878 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    depends_on:
      media-init:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
      - SERVICE_URL_BAZARR_6767
    volumes:
      - bazarr-config:/config
      - ${MEDIA_DIR}:/downloads
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:6767 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.10.7
    depends_on:
      media-init:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
      - SERVICE_URL_JELLYFIN_8096
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${MEDIA_DIR}:/downloads:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:8096/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  default:
    name: ${COOLIFY_NETWORK:-coolify}
    external: true

volumes:
  gluetun-data:
  prowlarr-config:
  transmission-config:
  sonarr-config:
  radarr-config:
  bazarr-config:
  jellyfin-config:
  jellyfin-cache:
